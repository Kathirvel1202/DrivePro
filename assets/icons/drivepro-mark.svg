<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="dpBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="dpGold" x1="16" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="dpShield" x1="20" y1="14" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="dpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#dpBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Subtle Inner Shield / Emblem Contour -->
  <path d="M32 10 C39 10 49 13 49 20 C49 33 39 46 32 52 C25 46 15 33 15 20 C15 13 25 10 32 10 Z" 
        fill="url(#dpShield)" stroke="url(#dpGold)" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Steering Wheel Outer Ring / Monogram 'D' Geometry -->
  <circle cx="32" cy="31" r="17" stroke="url(#dpGold)" stroke-width="3.2" stroke-linecap="round"/>
  
  <!-- Steering Wheel Center Hub & Nav Ring -->
  <circle cx="32" cy="31" r="5" fill="url(#dpGold)"/>
  <circle cx="32" cy="31" r="2" fill="#0f172a"/>

  <!-- Steering Wheel Spokes -->
  <line x1="15" y1="31" x2="27" y2="31" stroke="url(#dpGold)" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="37" y1="31" x2="49" y2="31" stroke="url(#dpGold)" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="32" y1="36" x2="32" y2="48" stroke="url(#dpGold)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Curving Road Ribbon to Future -->
  <path d="M26 49 L30 33 L34 33 L38 49 Z" fill="#0f172a" opacity="0.9"/>
  <line x1="32" y1="37" x2="32" y2="47" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2 2" stroke-linecap="round"/>

  <!-- Top Star Accent of Excellence -->
  <path d="M32 13 L33.2 16.5 L36.8 16.5 L33.9 18.6 L35 22 L32 19.8 L29 22 L30.1 18.6 L27.2 16.5 L30.8 16.5 Z" 
        fill="#fbbf24" filter="url(#dpShadow)"/>
</svg>
