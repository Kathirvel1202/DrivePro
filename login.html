<html lang="en">
<head>

<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="assets/icons/drivepro-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/palette.css">

<body data-page="login">
<main class="auth-main"><section class="auth-section"><div class="auth-layout"><div class="auth-card"><a class="auth-brand" href="index.html" aria-label="Back to DrivePro home"><img src="assets/icons/drivepro-mark.svg" alt=""><span>DrivePro</span></a><h1>Sign in</h1><p class="portal-inline-note" role="note">Student portal sign-in</p><form class="auth-form" data-auth-form="login"><div class="field"><label for="login-email">Email address</label><input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label for="login-password">Password</label><div class="password-wrap"><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="password-toggle" type="button" data-password-toggle="login-password" aria-label="Show password" aria-pressed="false"></button></div></div><div class="auth-links"><a href="contact.html">Need account help?</a><a href="register.html">Create account</a></div><p class="auth-status" data-auth-status aria-live="polite"></p><button class="button auth-submit" type="submit">Sign in</button></form></div></div></section></main>
</body>
</html>
