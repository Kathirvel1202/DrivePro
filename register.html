<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Student registration for DrivePro Driving School.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fffaf0">
<title>Student registration | DrivePro Driving School</title>
<link rel="icon" href="assets/icons/drivepro-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/palette.css">
<link rel="stylesheet" href="css/navigation.css">
<script src="js/business-config.js" defer></script>
<script src="js/main.js" defer></script>
</head>
<body data-page="register">
<main class="auth-main"><section class="auth-section"><div class="auth-layout"><div class="auth-card"><a class="auth-brand" href="index.html" aria-label="Back to DrivePro home"><img src="assets/icons/drivepro-mark.svg" alt=""><span>DrivePro</span></a><h1>Create your account</h1><p class="portal-inline-note" role="note">Create a student account</p><form class="auth-form" data-auth-form="register"><div class="field"><label for="reg-name">Full name</label><input id="reg-name" name="name" autocomplete="name" placeholder="Your full name" required></div><div class="field"><label for="reg-email">Email address</label><input id="reg-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label for="reg-phone">Phone number</label><input id="reg-phone" name="phone" type="tel" autocomplete="tel" placeholder="Your phone number"></div><div class="field"><label for="reg-course">Course interest</label><select id="reg-course" name="course"><option value="">Select a course</option><option>Beginner Car Driver License (Class D)</option><option>Automatic Transmission Course</option><option>Two-Wheeler / Motorcycle CBT (Class M)</option><option>Fast-Track Intensive License Prep</option><option>Refresher &amp; Nervous Driver Lessons</option><option>Commercial Delivery Van Training</option></select></div><div class="field"><label for="reg-password">Password</label><div class="password-wrap"><input id="reg-password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" required><button class="password-toggle" type="button" data-password-toggle="reg-password" aria-label="Show password" aria-pressed="false"></button></div></div><div class="auth-links"><span>Already have an account?</span><a href="login.html">Sign in</a></div><p class="auth-status" data-auth-status aria-live="polite"></p><button class="button auth-submit" type="submit">Create account</button></form></div></div></section></main>
</body>
</html>
